name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for (e.g., v0.7.2)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Get version from tag
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG=${{ inputs.tag }}
        else
          TAG=${GITHUB_REF#refs/tags/}
        fi
        VERSION=${TAG#v}
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Verify version matches pyproject.toml
      run: |
        PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
        if [ "${{ steps.get_version.outputs.version }}" != "${PYPROJECT_VERSION}" ]; then
          echo "Error: Tag version (${{ steps.get_version.outputs.version }}) does not match pyproject.toml version (${PYPROJECT_VERSION})"
          exit 1
        fi

    - name: Get previous tag
      id: get_previous_tag
      env:
        TAG: ${{ steps.get_version.outputs.tag }}
      run: |
        # -Fx: match the tag line exactly, so v0.9.1 doesn't also match v0.9.10
        PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -Fx -A1 "${TAG}" | tail -1)
        if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" = "${TAG}" ]; then
          # If no previous tag, use first commit
          PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
        fi
        echo "previous_tag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      env:
        TAG: ${{ steps.get_version.outputs.tag }}
        PREVIOUS_TAG: ${{ steps.get_previous_tag.outputs.previous_tag }}
      run: |
        # tformat (not format) terminates the last line, so the file always
        # ends with a newline.
        {
          echo "# Changes since ${PREVIOUS_TAG}"
          echo ""
          git log "${PREVIOUS_TAG}..${TAG}" --pretty=tformat:"- %s (%h)" --no-merges
        } > "${RUNNER_TEMP}/CHANGELOG.md"

        cat "${RUNNER_TEMP}/CHANGELOG.md"

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: Release ${{ steps.get_version.outputs.tag }}
        # body_path avoids round-tripping the changelog through GITHUB_OUTPUT,
        # where a commit subject of "EOF" would break the heredoc delimiter.
        body_path: ${{ runner.temp }}/CHANGELOG.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
